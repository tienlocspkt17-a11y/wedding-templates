<script id="ea-standalone-runtime">
(function() {
  // 1. Envelope opening interaction
  const envBtn = document.querySelector('.env-btn, .envelope-seal, #envelope, [data-action="open-envelope"]');
  if (envBtn) {
    envBtn.addEventListener('click', function(e) {
      e.preventDefault();
      const topSec = document.querySelector('.rs-top, .envelope-wrapper, #envelope-scene, #cover');
      if (topSec) topSec.classList.add('opened');
      const photo = document.querySelector('.env-photo');
      if (photo) photo.style.height = '140%';
      this.style.pointerEvents = 'none';
      setTimeout(function() {
        const next = document.querySelector('.sec:not(.m-hero), .module:not(.m-hero)');
        if (next) next.scrollIntoView({ behavior: 'smooth' });
      }, 900);
    });
  }

  // 2. Audio control
  const musicBtn = document.querySelector('.music-btn, #music-btn, .btn-audio');
  const audio = document.querySelector('audio');
  if (musicBtn && audio) {
    musicBtn.addEventListener('click', function(e) {
      e.preventDefault();
      if (audio.paused) {
        audio.play().then(function() {
          musicBtn.classList.add('is-playing', 'playing');
        }).catch(function() {});
      } else {
        audio.pause();
        musicBtn.classList.remove('is-playing', 'playing');
      }
    });
    var autoPlayOnTouch = function() {
      if (audio.paused) {
        audio.play().then(function() { musicBtn.classList.add('is-playing', 'playing'); }).catch(function() {});
      }
      document.removeEventListener('click', autoPlayOnTouch);
      document.removeEventListener('touchstart', autoPlayOnTouch);
    };
    document.addEventListener('click', autoPlayOnTouch, { once: true });
    document.addEventListener('touchstart', autoPlayOnTouch, { once: true });
  }

  // 3. Side switcher (Nhà trai / Nhà gái / Chung)
  const sides = document.querySelectorAll('.sides a, .side-toggle button');
  sides.forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      sides.forEach(function(b) { b.removeAttribute('aria-current'); });
      this.setAttribute('aria-current', 'true');
      const side = (this.dataset.side || this.textContent).toLowerCase();
      document.querySelectorAll('.when-groom, .groom-info').forEach(function(el) {
        el.style.display = (side.includes('trai') || side.includes('chung')) ? '' : 'none';
      });
      document.querySelectorAll('.when-bride, .bride-info').forEach(function(el) {
        el.style.display = (side.includes('gái') || side.includes('chung')) ? '' : 'none';
      });
    });
  });
})();
</script>
